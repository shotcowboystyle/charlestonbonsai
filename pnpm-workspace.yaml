minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver
  - "@vercel/cli-config@0.2.4"
  - "@vercel/oidc@3.8.5"
  - "@vercel/cli-exec@1.0.1"
  # cssnano monorepo (via nuxt 4.6): 9.x lost npm trustedPublisher metadata but
  # provenance still points at cssnano/cssnano .github/workflows/publish.yml.
  - cssnano@9.4.0
  - stylehacks@9.0.8
  - postcss-unique-selectors@9.0.6
  - postcss-svgo@9.0.5
  - postcss-reduce-transforms@9.0.5
  - postcss-reduce-initial@9.0.7
  - postcss-ordered-values@9.0.8
  - postcss-normalize-whitespace@9.0.6
  - postcss-normalize-url@9.0.6
  - postcss-normalize-unicode@9.0.6
  - postcss-normalize-timing-functions@9.0.6
  - postcss-normalize-string@9.0.6
  - postcss-normalize-repeat-style@9.0.6
  - postcss-normalize-positions@9.0.7
  - postcss-normalize-display-values@9.0.6
  - postcss-normalize-charset@9.0.6
  - postcss-minify-selectors@9.0.7
  - postcss-minify-params@9.0.7
  - postcss-minify-gradients@9.0.7
  - postcss-minify-font-values@9.0.8
  - postcss-merge-rules@9.1.3
  - postcss-merge-longhand@9.3.0
  - postcss-discard-overridden@9.0.6
  - postcss-discard-empty@9.0.7
  - postcss-discard-duplicates@9.0.6
  - postcss-discard-comments@9.0.7
  - postcss-convert-values@9.0.8
  - postcss-colormin@9.0.7
  - cssnano-utils@8.2.1
  - cssnano-preset-default@9.4.0

shellEmulator: true

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - unrs-resolver
  - vue-demi
