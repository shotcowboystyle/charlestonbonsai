name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nitro prerenders `/`, which calls /api/trees/featured at build time. Pointing
  # Supabase at a dead port fails instantly with ECONNREFUSED; that handler
  # catches it and renders the empty state, so CI never depends on live data or
  # on network egress, and no repository secrets are required.
  SUPABASE_URL: http://127.0.0.1:1
  SUPABASE_ANON_KEY: ci-anon-key
  SUPABASE_SERVICE_KEY: ci-service-key
  NUXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
  NUXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  JWT_SECRET: ci-jwt-secret
  SITE_URL: http://localhost:3000

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must run before setup-node so that `cache: pnpm` can resolve the pnpm
      # store path. The version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # postinstall already runs this, but typecheck and build both depend on
      # .nuxt existing — repeat it so the job never silently relies on a
      # lifecycle script that a future --ignore-scripts would skip.
      - run: pnpm nuxt prepare

      # `lint`, not `lint:ci`, would rewrite files and then report success.
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm nuxt prepare

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The browser binaries are cached; the OS-level shared libraries are not.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # playwright.config.ts starts the server itself (`pnpm build && pnpm preview`).
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
